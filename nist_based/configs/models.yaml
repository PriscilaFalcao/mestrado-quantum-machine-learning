models:
  mlp:
    hidden_layer_sizes: [64, 32]
    activation: relu
    alpha: 0.0001
    learning_rate_init: 0.001
    max_iter: 800
    random_state: 42

  vqc:
    num_qubits: 4
    ansatz_reps: 2
    encoding: ry  # 'zz' (ZZFeatureMap) nao aprende esta tarefa; ver README
    output_scale: 2.5  # a saida do circuito fica em [-1, 1]; o alvo padronizado chega a ~+-3
    input_scale: 0.5  # PCA whitened x escala = angulos de entrada
    optimizer: COBYLA
    optimizer_maxiter: 500
    random_state: 42
    # O treino do VQC (COBYLA no simulador Qiskit) escala com o numero de amostras; null = usa todas.
    max_train_samples: 1000
